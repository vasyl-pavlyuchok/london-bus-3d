<title>__TITULO__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: el autobús ocupa toda la pantalla; un panel de mando flota a la izquierda (abajo en el móvil) */
:root {
  --bg: #e9eaec;
  --panel: rgba(255, 255, 255, 0.86);
  --fg: #1d1f24;
  --muted: #5f646e;
  --line: #d3d5da;
  --accent: #c8121c;
  --accent-fg: #ffffff;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --panel: rgba(28, 31, 37, 0.88); --fg: #eceef2; --muted: #9aa0ab;
    --line: #343843; --accent: #e8333b; --accent-fg: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --panel: rgba(28, 31, 37, 0.88); --fg: #eceef2; --muted: #9aa0ab;
  --line: #343843; --accent: #e8333b; --accent-fg: #ffffff; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--display); overflow: hidden; }
#escena { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.panel {
  position: fixed; top: max(16px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  width: min(300px, calc(100% - 32px)); background: var(--panel); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 12px;
  padding-block: 16px; padding-inline: 16px; display: flex; flex-direction: column; gap: 14px;
}
h1 { margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
h1 span { color: var(--accent); }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 0.82rem; line-height: 1.4; }
.grupo { display: flex; flex-direction: column; gap: 6px; }
.etq { font-family: var(--mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.botones { display: flex; flex-wrap: wrap; gap: 6px; }
button {
  font: 500 0.8rem var(--display); color: var(--fg); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 11px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.datos { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-family: var(--mono); font-size: 0.74rem; }
.datos dt { color: var(--muted); }
.datos dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.ayuda { font-size: 0.74rem; color: var(--muted); margin: 0; }
#cargando { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--mono); color: var(--muted); pointer-events: none; }
@media (max-width: 640px) {
  .panel { top: auto; bottom: max(16px, env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
           right: max(16px, env(safe-area-inset-right, 0px)); width: auto; gap: 10px; padding-block: 12px; }
  .sub, .ayuda, .datos { display: none; }
}
</style>

<canvas id="escena" aria-label="__TITULO__ en 3D, se puede girar y acercar"></canvas>
<div id="cargando">Cargando el modelo…</div>

<aside class="panel">
  <div>
    <h1>__TITULO__ <span>3D</span></h1>
    <p class="sub">__SUBTITULO__ Arrastra para girar, rueda o pellizca para acercar.</p>
  </div>
  <div class="grupo">
    <span class="etq">Vista</span>
    <div class="botones" id="vistas">
      <button id="v-34" data-v="34" aria-pressed="true">3/4 delantera</button>
      <button id="v-front" data-v="front">Frontal</button>
      <button id="v-cond" data-v="cond">Lado derecho</button>
      <button id="v-puertas" data-v="puertas">Lado izquierdo</button>
      <button id="v-tras" data-v="tras">Trasera</button>
    </div>
  </div>
  <div class="grupo">
    <span class="etq">Modelo</span>
    <div class="botones">
      <button id="m-mid" aria-pressed="true">Detallado</button>
      <button id="m-lod" aria-pressed="false">LOD1 (ligero)</button>
      <button id="m-int" aria-pressed="false">Ver interior</button>
      <button id="m-giro" aria-pressed="false">Girar solo</button>
    </div>
  </div>
  <dl class="datos">
    <dt>Triángulos</dt><dd id="d-tri">—</dd>
    <dt>Materiales</dt><dd id="d-mat">—</dd>
    <dt>Medidas</dt><dd id="d-med">—</dd>
  </dl>
  <p class="ayuda">__NOTA__</p>
</aside>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
var GLB_B64 = "__GLB_B64__";
(function () {
  var canvas = document.getElementById("escena");
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  } catch (e) {
    document.getElementById("cargando").textContent = "Este navegador tiene el 3D (WebGL) desactivado. Ábrelo en Chrome, Safari o Firefox.";
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var scene = new THREE.Scene();
  var pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

  var camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
  var controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 4;
  controls.maxDistance = 45;
  controls.maxPolarAngle = Math.PI * 0.495;
  controls.target.set(0, 2, 0);

  scene.add(new THREE.HemisphereLight(0xdfe6f0, 0x3a3836, 0.55));
  var sol = new THREE.DirectionalLight(0xffffff, 1.6);
  sol.position.set(-9, 14, 8);
  sol.castShadow = true;
  sol.shadow.mapSize.set(2048, 2048);
  var sc = sol.shadow.camera; sc.left = -9; sc.right = 9; sc.top = 9; sc.bottom = -9; sc.near = 1; sc.far = 40;
  scene.add(sol);

  var suelo = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.ShadowMaterial({ opacity: 0.22 }));
  suelo.rotation.x = -Math.PI / 2;
  suelo.receiveShadow = true;
  scene.add(suelo);

  // Convención glTF del modelo: frontal hacia +Z, Y arriba; el lado derecho del objeto queda en -X.
  // Las vistas se calculan del tamaño del modelo al cargarlo.
  var VISTAS = { "34": [[-11.5, 3.2, 11.5], [0, 1.9, 0.5]] };
  function calcularVistas(box) {
    var c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
    var D = Math.max(s.x, s.y, s.z) * 1.55, y = c.y;
    VISTAS = {
      "34": [[c.x - D * 0.72, y + s.y * 0.25, c.z + D * 0.72], [c.x, y - s.y * 0.05, c.z + s.z * 0.05]],
      "front": [[c.x, y + s.y * 0.05, c.z + D], [c.x, y, c.z]],
      "cond": [[c.x - D * 1.15, y, c.z], [c.x, y, c.z]],
      "puertas": [[c.x + D * 1.15, y, c.z], [c.x, y, c.z]],
      "tras": [[c.x + s.x * 0.15, y + s.y * 0.08, c.z - D], [c.x, y, c.z]]
    };
    controls.minDistance = Math.max(s.x, s.y, s.z) * 0.35;
    controls.maxDistance = D * 4;
    var sc = sol.shadow.camera, r = Math.max(s.x, s.z) * 0.8;
    sc.left = -r; sc.right = r; sc.top = r; sc.bottom = -r; sc.updateProjectionMatrix();
  }
  var anim = null;
  function irA(nombre) {
    var v = VISTAS[nombre];
    anim = { t: 0, p0: camera.position.clone(), t0: controls.target.clone(),
             p1: new THREE.Vector3().fromArray(v[0]), t1: new THREE.Vector3().fromArray(v[1]) };
    document.querySelectorAll("#vistas button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.v === nombre ? "true" : "false");
    });
  }
  camera.position.fromArray(VISTAS["34"][0]);
  controls.target.fromArray(VISTAS["34"][1]);

  var mid = null, lod = null, vidrios = [];
  function b64ToBuffer(b64) {
    var bin = atob(b64), n = bin.length, u = new Uint8Array(n);
    for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
    return u.buffer;
  }
  new THREE.GLTFLoader().parse(b64ToBuffer(GLB_B64), "", function (gltf) {
    var mats = new Set(), tris = 0;
    gltf.scene.traverse(function (o) {
      if (!o.isMesh) return;
      o.castShadow = true; o.receiveShadow = true;
      var arr = Array.isArray(o.material) ? o.material : [o.material];
      arr.forEach(function (m) {
        // reflejo, no luz propia: superficies lisas que devuelven el entorno
        if (m.name && m.name.indexOf("vidrio") >= 0) {
          m.roughness = 0.0; m.metalness = 0.0; m.envMapIntensity = 2.6;
          if (m.transparent) { m.depthWrite = false; m.opacity = 0.88; vidrios.push(m); }
        }
        if (/_pintura$/.test(m.name)) {
          m.roughness = 0.12; m.envMapIntensity = 1.5;
          if ("clearcoat" in m) { m.clearcoat = 1.0; m.clearcoatRoughness = 0.03; }
        }
        if (/metal/.test(m.name)) m.envMapIntensity = 1.6;
      });
    });
    gltf.scene.children.forEach(function (n) {
      if (/_LOD1$/.test(n.name)) lod = lod || n; else mid = mid || n;
    });
    if (mid) mid.traverse(function (o) {
      if (!o.isMesh) return;
      var g = o.geometry; tris += g.index ? g.index.count / 3 : g.attributes.position.count / 3;
      (Array.isArray(o.material) ? o.material : [o.material]).forEach(function (m) { mats.add(m.name); });
    });
    if (lod) lod.visible = false;
    scene.add(gltf.scene);
    var box = new THREE.Box3().setFromObject(mid || gltf.scene), sz = box.getSize(new THREE.Vector3());
    calcularVistas(box);
    camera.position.fromArray(VISTAS["34"][0]); controls.target.fromArray(VISTAS["34"][1]);
    document.getElementById("d-med").textContent =
      [sz.z, sz.x, sz.y].map(function (v) { return v.toFixed(2).replace(".", ","); }).join(" × ") + " m";
    if (!vidrios.length) document.getElementById("m-int").hidden = true;
    if (!lod) document.getElementById("m-lod").hidden = true;
    document.getElementById("d-tri").textContent = Math.round(tris).toLocaleString("es-ES");
    document.getElementById("d-mat").textContent = mats.size;
    document.getElementById("cargando").hidden = true;
  }, function (err) {
    document.getElementById("cargando").textContent = "No se pudo leer el modelo: " + err;
  });

  function setPressed(id, on) { document.getElementById(id).setAttribute("aria-pressed", on ? "true" : "false"); }
  document.querySelectorAll("#vistas button").forEach(function (b) {
    b.addEventListener("click", function () { irA(b.dataset.v); });
  });
  document.getElementById("m-mid").addEventListener("click", function () {
    if (!mid) return; mid.visible = true; if (lod) lod.visible = false; setPressed("m-mid", true); setPressed("m-lod", false);
  });
  document.getElementById("m-lod").addEventListener("click", function () {
    if (!lod) return; lod.visible = true; if (mid) mid.visible = false; setPressed("m-lod", true); setPressed("m-mid", false);
  });
  var interior = false;
  document.getElementById("m-int").addEventListener("click", function () {
    interior = !interior;
    vidrios.forEach(function (m) { m.opacity = interior ? 0.25 : 0.88; });
    setPressed("m-int", interior);
  });
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.getElementById("m-giro").addEventListener("click", function () {
    controls.autoRotate = !controls.autoRotate; controls.autoRotateSpeed = 0.8;
    setPressed("m-giro", controls.autoRotate);
  });

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w < 640 ? 50 : 35;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();

  function loop() {
    if (anim) {
      anim.t = reduce ? 1 : Math.min(1, anim.t + 0.035);
      var k = anim.t < 0.5 ? 2 * anim.t * anim.t : 1 - Math.pow(-2 * anim.t + 2, 2) / 2;
      camera.position.lerpVectors(anim.p0, anim.p1, k);
      controls.target.lerpVectors(anim.t0, anim.t1, k);
      if (anim.t >= 1) anim = null;
    }
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
